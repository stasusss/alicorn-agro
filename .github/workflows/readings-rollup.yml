name: readings-rollup

on:
  schedule:
    # After the quota check. 07:30 UTC.
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collapse readings older than 14 days
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:rollup
